<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AA Plug</title>
  <meta name="description" content="AA Plug 1 and AA Plug 2, from MOTOR AA.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://aaplug.com/">
  <link rel="icon" href="icons/favicon.svg?v=6" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png?v=6" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="icons/icon-512.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=6">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/apple-touch-icon-512.png?v=6">
  <link rel="manifest" href="manifest.json">
  <meta property="og:site_name" content="AA Plug">
  <meta property="og:title" content="AA Plug">
  <meta property="og:description" content="AA Plug 1 and AA Plug 2, from MOTOR AA.">
  <meta property="og:url" content="https://aaplug.com/">
  <meta property="og:image" content="https://aaplug.com/icons/og.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AA Plug">
  <meta name="twitter:description" content="AA Plug 1 and AA Plug 2, from MOTOR AA.">
  <meta name="twitter:image" content="https://aaplug.com/icons/og.png">
  <style>
    @font-face {
      font-family: Geist;
      src: url("fonts/geist.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: GeistMono;
      src: url("fonts/geist-mono.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #ffffff;
      --fg: #111318;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .055) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center center;
      mask-image: radial-gradient(ellipse 85% 70% at 50% 44%, #000 20%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 44%, #000 20%, transparent 72%);
    }
    header {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      padding: 32px 24px 0;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      text-align: center;
    }
    header .mark {
      display: inline-block;
      font-family: GeistMono, ui-monospace, monospace;
      font-size: clamp(12px, 3.1vw, 13px);
      font-weight: 500;
      letter-spacing: .08em;
      color: var(--muted);
      line-height: 1.5;
      text-wrap: balance;
    }
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px calc(32px + env(safe-area-inset-bottom));
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .plugs {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(28px, 7vw, 64px);
    }
    .plug {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }
    .plug img {
      display: block;
      width: clamp(72px, 18vw, 96px);
      height: auto;
      border-radius: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      filter:
        drop-shadow(0 1px 1px rgba(15, 23, 42, .05))
        drop-shadow(0 10px 24px rgba(15, 23, 42, .10));
    }
    .plug span {
      font-size: clamp(.85rem, 2.2vw, .95rem);
      font-weight: 560;
      letter-spacing: .01em;
      color: var(--fg);
    }
    @media (max-width: 360px) {
      .plugs { gap: 22px; }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <header><span class="mark">AA MCP Plugins for AI users</span></header>
  <main>
    <h1>AA Plug</h1>
    <ul class="plugs">
      <li class="plug plug-1">
        <img src="icons/aa-plug-1.svg" width="96" height="96" alt="AA Plug 1" draggable="false">
        <span>AA Plug 1</span>
      </li>
      <li class="plug plug-2">
        <img src="icons/aa-plug-2.svg" width="96" height="96" alt="AA Plug 2" draggable="false">
        <span>AA Plug 2</span>
      </li>
    </ul>
  </main>
</body>
</html>
