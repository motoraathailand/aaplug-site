<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AA Plug</title>
  <meta name="description" content="AA Plug 1 and AA Plug 2, from MOTOR AA.">
  <meta name="theme-color" content="#0c0d12">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://aaplug.com/">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta property="og:site_name" content="AA Plug">
  <meta property="og:title" content="AA Plug">
  <meta property="og:description" content="AA Plug 1 and AA Plug 2, from MOTOR AA.">
  <meta property="og:url" content="https://aaplug.com/">
  <meta property="og:image" content="https://aaplug.com/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AA Plug">
  <meta name="twitter:description" content="AA Plug 1 and AA Plug 2, from MOTOR AA.">
  <meta name="twitter:image" content="https://aaplug.com/icons/og.png">
  <style>
    :root {
      --bg: #0c0d12;
      --fg: #f4f5f8;
      --muted: #8a8e9b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, #171924 0%, var(--bg) 68%);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 28px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .plugs {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(36px, 10vw, 96px);
    }
    .plug {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
    }
    .plug img {
      display: block;
      width: clamp(120px, 30vw, 176px);
      height: auto;
      border-radius: 23.4375%;
    }
    .plug-1 img {
      box-shadow: 0 18px 44px rgba(58, 63, 207, .38), 0 10px 28px rgba(0,0,0,.4);
    }
    .plug-2 img {
      box-shadow: 0 18px 44px rgba(12, 143, 134, .38), 0 10px 28px rgba(0,0,0,.4);
    }
    .plug span {
      font-size: clamp(1rem, 2.6vw, 1.125rem);
      font-weight: 600;
      letter-spacing: .015em;
    }
    footer {
      flex-shrink: 0;
      padding: 20px 16px calc(22px + env(safe-area-inset-bottom));
      text-align: center;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .18em;
    }
    @media (max-width: 360px) {
      .plugs { gap: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>AA Plug</h1>
    <ul class="plugs">
      <li class="plug plug-1">
        <img src="icons/aa-plug-1.svg" width="176" height="176" alt="AA Plug 1" draggable="false">
        <span>AA Plug 1</span>
      </li>
      <li class="plug plug-2">
        <img src="icons/aa-plug-2.svg" width="176" height="176" alt="AA Plug 2" draggable="false">
        <span>AA Plug 2</span>
      </li>
    </ul>
  </main>
  <footer>MOTOR AA</footer>
</body>
</html>
